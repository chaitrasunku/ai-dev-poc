# A generic, usable sample. This file can be used as a base for Alembic.
#
# See http://alembic.sqlalchemy.org/en/latest/regions.html for the full
# set of options.

[alembic]
# path to migration scripts
script_location = petstore/app/database/migrations

# template used to generate new revision files.
# Default format is %%(rev)s_%%(slug)s
# Generic:
# revision_script_template =
# Advanced:
# revision_script_template = %%(rev)s_%%(slug)s

# sys.path entry for script_location
# This is usually relative to the alembic.ini file. Python scripts are
# loaded from this directory.
# This should point to the parent directory of petstore, or directly to petstore
# if alembic is run from project root.
# Given the directory structure, it should be the project root.
# Make sure to set `PYTHONPATH=.` when running alembic from project root.
# Or, set the entry to `.` if alembic is run from `petstore/` directory.
# Let's assume alembic is run from `petstore/` directory
file_template = %%(rev)s_%%(year)s%%(month)s%%(day)s_%%(hour)s%%(minute)s-%%(message)s

# entry point for script.py.mako, or other variant
# This is usually the value passed to the -t argument of alembic init.
# For async, it is "async".
# script.py.mako sets target_metadata based on app.models.base
# (Alembic init with -t async creates a `script.py.mako` tailored for async usage.)
# We will modify `env.py` generated by `alembic init` to correctly import Base.metadata.

# generic, 'autogenerate' options
#
# Whether to include schema comments in the output of 'autogenerate'.
# This is a boolean, defaults to False.
# autogenerate_include_schema_comments = True

# When autogenerate is in use, whether to generate a 'noop' migration
# when no changes are detected. Defaults to True.
# autogenerate_on_revision_generation = False

# version table configuration
version_table = alembic_version
version_table_schema =

# current revision identification format; defaults to %%(rev)s (%%(branch)s)
# revision_id_format =

# verbosity of 'logs' command output
# log_config = logging.ini


[post_write_hooks]
# post_write_hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 79


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = INFO
handlers = console
qualname =

[logger_sqlalchemy]
level = INFO
handlers = console
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers = console
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %%(levelname)-5s [%%(name)s] %%(message)s
datefmt = %%H:%%M:%%S